[package]
name = "shielded-pool"
version = "0.1.0"
edition = "2024"

[dependencies]
midnight-circuits = { git = "https://github.com/EYBlockchain/midfall" }
midnight-aggregator = { git = "https://github.com/EYBlockchain/midfall", optional = true }
midnight-curves = { git = "https://github.com/EYBlockchain/midfall" }
midnight-proofs = { git = "https://github.com/EYBlockchain/midfall" }
midnight-zk-stdlib = { git = "https://github.com/EYBlockchain/midfall" }
sha2 = "0.10.9"
rand = "0.8"
rand_chacha = "0.3"
ff = "0.13.1"
group = "0.13.0"
rand_core = "0.9.3"
halo2curves = "0.9.0"
rustfmt = "0.10.0"
rayon = "1.11.0"
blake2b_simd = "1.0.3"
sha3 = "0.10.8"
thiserror = "2.0.18"
proptest = "1.9.0"

[features]
default = ["truncated-challenges"]
dev-curves = [
  "midnight-curves/dev-curves",
  "midnight-proofs/dev-curves",
  "midnight-circuits/dev-curves",
]
truncated-challenges = [
  "midnight-proofs/truncated-challenges",
  "midnight-circuits/truncated-challenges",
]

# only build aggregator when you explicitly ask for it
aggregation = ["midnight-aggregator"]

[patch.crates-io]
midnight-circuits = { git = "https://github.com/EYBlockchain/midfall" }
midnight-curves = { git = "https://github.com/EYBlockchain/midfall" }
midnight-proofs = { git = "https://github.com/EYBlockchain/midfall" }
midnight-zk-stdlib = { git = "https://github.com/EYBlockchain/midfall" }
